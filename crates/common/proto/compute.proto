syntax = "proto3";
package compute;

service CUDAExecutor {
    // Client sends code, Host streams back compilation/execution logs
    rpc ExecuteCode(ComputeRequest) returns (stream ComputeResponse);
    // Get current status of the GPU(s)
    rpc GetGpuStatus(Empty) returns (GpuStatus);
}

message ComputeRequest {
  // Key: The relative path of the file (e.g., "main.cu" or "include/utils.cuh")
  // Value: The raw text content of the file
  map<string, string> files = 1;
  
  // The filename that nvcc should target for the main compilation
  string entry_point_file = 2;
  
  // User-provided flags (e.g., "-arch=sm_80")
  repeated string compiler_flags = 3;
}

message ComputeResponse {
    string output = 1; // Could be stdout, stderr, or status updates
    bool is_error = 2;
}

message Empty {}

message GpuStatus {
    string gpu_name = 1;
    uint32 temperature_celsius = 2;
    uint32 memory_used_mb = 3;
    uint32 memory_total_mb = 4;
    uint32 load_percentage = 5;
}
